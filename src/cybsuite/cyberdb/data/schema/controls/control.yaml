description: "Security control implementation and validation status"
extra:
  web_menu: controls_reports
fields:
  control_definition:
    type: control_definition
    repr: true
    in_filter_query: true
    description: "Reference to control definition"
  status:
    type: str
    indexed: true
    default: not_started
    description: "Current control validation state. unknown when we can't determine the status."
    choices:
      - ok
      - ko
      - not_applicable
      - not_started
      - in_progress
      - manual
      - unknown
  details:
    type: dict
    repr: true
    in_filter_query: true
    indexed: true
    description: "Control-specific validation data"
  # TODO: fix severity, either keep default none or undefined, but not both
  severity:
    type: str
    default: null
    description: "Impact severity level"
    choices: [ 'undefined','info', 'low', 'medium', 'high', 'critical' ]
  confidence:
    description: "Finding confidence level"
    type: str
    default: null
    choices:
      - undefined
      - true_positive
      - certain
      - firm
      - tentative
      - manual
      - false_positive
  justification:
    type: str
    default: null
    description: "Evidence and reasoning for control status"
    examples:
      - "Identified in file /etc/shadow"
      - "Identified pattern in HTML response"
      - "Version is known to have bad CVE"
  latest_run:
    type: run
    default: null
    description: "Most recent execution reference"
